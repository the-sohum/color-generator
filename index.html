<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Palette Generator 🎨</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Color Palette Generator 🎨</h1>
    <button id="theme-toggle-btn" class="btn">🌙 Dark Mode</button>
  </header>

  <main>
    <div class="palette-container">
      <!-- Color Card 1 -->
      <div class="color-card">
        <div class="color-display" id="color-0"></div>
        <div class="card-info">
          <span class="hex-text" id="hex-0">#FFFFFF</span>
          <div class="card-actions">
            <button class="lock-btn" id="lock-0">🔓 Lock</button>
            <button class="copy-btn" id="copy-0">📋 Copy</button>
          </div>
        </div>
      </div>

      <!-- Color Card 2 -->
      <div class="color-card">
        <div class="color-display" id="color-1"></div>
        <div class="card-info">
          <span class="hex-text" id="hex-1">#FFFFFF</span>
          <div class="card-actions">
            <button class="lock-btn" id="lock-1">🔓 Lock</button>
            <button class="copy-btn" id="copy-1">📋 Copy</button>
          </div>
        </div>
      </div>

      <!-- Color Card 3 -->
      <div class="color-card">
        <div class="color-display" id="color-2"></div>
        <div class="card-info">
          <span class="hex-text" id="hex-2">#FFFFFF</span>
          <div class="card-actions">
            <button class="lock-btn" id="lock-2">🔓 Lock</button>
            <button class="copy-btn" id="copy-2">📋 Copy</button>
          </div>
        </div>
      </div>

      <!-- Color Card 4 -->
      <div class="color-card">
        <div class="color-display" id="color-3"></div>
        <div class="card-info">
          <span class="hex-text" id="hex-3">#FFFFFF</span>
          <div class="card-actions">
            <button class="lock-btn" id="lock-3">🔓 Lock</button>
            <button class="copy-btn" id="copy-3">📋 Copy</button>
          </div>
        </div>
      </div>

      <!-- Color Card 5 -->
      <div class="color-card">
        <div class="color-display" id="color-4"></div>
        <div class="card-info">
          <span class="hex-text" id="hex-4">#FFFFFF</span>
          <div class="card-actions">
            <button class="lock-btn" id="lock-4">🔓 Lock</button>
            <button class="copy-btn" id="copy-4">📋 Copy</button>
          </div>
        </div>
      </div>
    </div>

    <button id="generate-btn" class="btn primary-btn">✨ Generate New Palette</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
